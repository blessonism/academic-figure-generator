services:
  backend:
    environment:
      APP_ENV: development
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:8082","http://127.0.0.1:8082","http://localhost:5173","http://127.0.0.1:5173","http://localhost"]'
    ports:
      - "8000:8000"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    ports:
      - "${APP_HTTP_PORT:-8082}:80"
    depends_on:
      - backend
      - frontend

volumes:
  frontend_node_modules:
